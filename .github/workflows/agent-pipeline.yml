# .github/workflows/agent-pipeline.yml
#
# Runs Plan → QA → Code → QC → PR for a single issue.
# Triggered by the Mac orchestrator (workflow_dispatch) or manually.
#
# Drop this file into each repo you want the agent to manage.
# Requires repo secret: ANTHROPIC_API_KEY

name: Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string
      integration_branch:
        description: "Branch the agent pushes work to"
        required: false
        default: "dev"
        type: string
      production_branch:
        description: "Branch the final PR targets"
        required: false
        default: "main"
        type: string

permissions:
  contents: write       # push to dev branch
  issues: write         # comment on issues
  pull-requests: write  # open PR to main
  actions: read
  id-token: write       # required by claude-code-action for GitHub App auth

concurrency:
  # One run per issue at a time; new dispatches wait rather than collide.
  group: agent-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}
          fetch-depth: 0

      - id: vars
        run: echo "branch=agent/issue-${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"

      - name: Create working branch off integration branch
        run: |
          git config user.name  "claude-agent[bot]"
          git config user.email "claude-agent[bot]@users.noreply.github.com"
          git checkout -B "${{ steps.vars.outputs.branch }}" origin/${{ inputs.integration_branch }}
          git push -f origin "${{ steps.vars.outputs.branch }}"

      # ─── PLAN ─────────────────────────────────────────────────────────────
      # Claude reads the issue + repo, writes a plan comment, and emits a
      # prompt for the next stage (saved as an artifact).
      - name: Prepare agent workspace
        run: mkdir -p .agent

      - name: Plan
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the PLAN agent. Use the `planning` skill in
            `.claude/skills/planning/SKILL.md`.

            Issue: #${{ inputs.issue_number }} in ${{ github.repository }}.

            Steps:
              1. Read the issue (title, body, comments) via `gh issue view`.
              2. Inspect the repo to understand the code that will change.
              3. Write the plan to `.agent/plan-comment.md`. Format per the
                 planning skill (Summary / Approach / Files / Risks). Do NOT
                 post it yourself — the workflow posts it after you finish.
              4. Write the implementation prompt to `.agent/next-prompt.md`
                 — concrete enough for the QA and Code stages to act on
                 without re-reading the issue.

            Do not modify source code in this step.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(git:*),Read,Write,Glob,Grep"
            --max-turns 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post plan comment
        run: |
          printf '\n---\n*:robot: This plan was drafted by an automated agent. A human will review the resulting PR before anything merges.*\n' \
            >> .agent/plan-comment.md
          gh issue comment "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file .agent/plan-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload plan prompt
        uses: actions/upload-artifact@v4
        with:
          name: next-prompt
          path: .agent/next-prompt.md
          if-no-files-found: error

  qa:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: next-prompt
          path: .agent

      # ─── QA: write tests first ───────────────────────────────────────────
      - name: Write failing tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the QA agent. Use `.claude/skills/test-authoring/SKILL.md`.

            The plan is in `.agent/next-prompt.md`.

            Write unit tests that:
              - encode the behavior the plan promises,
              - are expected to FAIL right now (the code doesn't exist yet),
              - follow this repo's existing test conventions
                (detect language/framework from the repo).

            Commit the tests to the working branch with message:
              "test: add failing tests for issue #${{ inputs.issue_number }}"
          claude_args: |
            --allowed-tools "Bash(git:*),Bash(npm:*),Bash(pnpm:*),Bash(pytest:*),Bash(cargo:*),Bash(go:*),Read,Write,Edit,Glob,Grep"
            --max-turns 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code:
    needs: [plan, qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: next-prompt
          path: .agent

      # ─── CODE + QC LOOP ──────────────────────────────────────────────────
      # Claude implements the plan, then runs the test suite. If anything
      # fails, it iterates. Bounded by --max-turns so a runaway run can't
      # rack up tokens forever.
      - name: Implement and run tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the CODE agent. Use `.claude/skills/implementation/SKILL.md`.

            The plan is in `.agent/next-prompt.md`. Failing tests are already
            on the branch.

            Loop:
              1. Detect this repo's toolchain (look at package.json /
                 pyproject.toml / Cargo.toml / go.mod / etc).
              2. Implement the plan.
              3. Run the test command for this repo.
              4. If tests fail, fix and re-run. Do NOT relax the tests
                 unless they're objectively wrong; explain in a commit if so.
              5. Stop when the suite is green OR after 5 fix attempts.

            Commit incrementally. Final commit message:
              "feat: implement issue #${{ inputs.issue_number }}"

            When the suite is green, write `.agent/completion-comment.md`:
              - What was implemented (plain English, brief)
              - Any deviations from `.agent/next-prompt.md` and why
              - Anything a reviewer should pay close attention to in the PR

            If you are stopping after exhausting fix attempts, write
            `.agent/failure-comment.md` instead:
              - What you attempted
              - Which test is still failing and the exact error
              - Suggested next steps for a human to continue
          claude_args: |
            --allowed-tools "Bash(git:*),Bash(npm:*),Bash(pnpm:*),Bash(yarn:*),Bash(pytest:*),Bash(python:*),Bash(uv:*),Bash(cargo:*),Bash(go:*),Bash(make:*),Read,Write,Edit,Glob,Grep"
            --max-turns 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to integration branch
        # Fast-forward the integration branch to the agent branch only if all
        # tests passed. If the prior step failed, this step is skipped and the
        # branch stays as a "stuck" artifact for human inspection.
        run: |
          git config user.name  "claude-agent[bot]"
          git config user.email "claude-agent[bot]@users.noreply.github.com"
          git fetch origin ${{ inputs.integration_branch }}
          git checkout ${{ inputs.integration_branch }}
          git merge --ff-only "${{ needs.plan.outputs.branch }}" || {
            echo "non-fast-forward; opening PR to ${{ inputs.integration_branch }} instead"
            gh pr create --base ${{ inputs.integration_branch }} --head "${{ needs.plan.outputs.branch }}" \
              --title "agent: issue #${{ inputs.issue_number }} (merge to ${{ inputs.integration_branch }})" \
              --body  "Auto-generated. Could not fast-forward."
            exit 0
          }
          git push origin ${{ inputs.integration_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post completion comment
        if: success()
        run: |
          if [[ ! -f .agent/completion-comment.md ]]; then exit 0; fi
          {
            cat .agent/completion-comment.md
            printf '\n---\n*:robot: Posted automatically after the agent completed implementation. See the PR for full changes.*\n'
          } > /tmp/completion.md
          gh issue comment "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/completion.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    needs: [plan, code]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}

      # ─── Wait for integration branch CI to pass ──────────────────────────
      # This assumes you have a separate CI workflow on push to the integration
      # branch. We poll its latest run for the commit we just pushed.
      - name: Wait for integration CI
        run: |
          sha=$(git rev-parse HEAD)
          echo "waiting on CI for $sha"
          for i in $(seq 1 60); do  # ~30 minutes max
            state=$(gh run list --branch ${{ inputs.integration_branch }} --commit "$sha" \
              --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"' || echo "missing:")
            echo "  [$i] $state"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "CI failed"; exit 1 ;;
            esac
            sleep 30
          done
          echo "timed out waiting for CI"; exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR to production
        # Skipped when integration and production are the same branch —
        # the code is already where it needs to be.
        if: inputs.integration_branch != inputs.production_branch
        run: |
          # Idempotent: if a PR already exists for this pair, comment instead.
          existing=$(gh pr list \
            --base ${{ inputs.production_branch }} \
            --head ${{ inputs.integration_branch }} \
            --state open --json number --jq '.[0].number' || echo "")
          if [[ -n "$existing" ]]; then
            gh pr comment "$existing" \
              --body "Issue #${{ inputs.issue_number }} merged into ${{ inputs.integration_branch }} and passed CI."
          else
            gh pr create \
              --base ${{ inputs.production_branch }} \
              --head ${{ inputs.integration_branch }} \
              --title "Release: ${{ inputs.integration_branch }} → ${{ inputs.production_branch }}" \
              --body "Includes issue #${{ inputs.issue_number }}. CI green on ${{ inputs.integration_branch }}. Ready for human review."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: [plan, qa, code, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}
          fetch-depth: 0

      - name: Post failure comment
        if: needs.integration.result != 'success'
        run: |
          branch="agent/issue-${{ inputs.issue_number }}"

          # Identify the furthest stage that failed.
          if   [[ "${{ needs.plan.result }}"        == "failure" ]]; then stage="PLAN"
          elif [[ "${{ needs.qa.result }}"          == "failure" ]]; then stage="QA (test authoring)"
          elif [[ "${{ needs.code.result }}"        == "failure" ]]; then stage="CODE (implementation)"
          else                                                             stage="INTEGRATION (CI on \`${{ inputs.integration_branch }}\`)"
          fi

          # Pull Claude's failure note from the agent branch if it exists.
          git fetch origin "${branch}" --depth=10 2>/dev/null || true
          git checkout "origin/${branch}" -- .agent/ 2>/dev/null || true

          {
            echo "## Agent stopped — ${stage} stage"
            echo ""
            if [[ -f .agent/failure-comment.md ]]; then
              cat .agent/failure-comment.md
            else
              echo "The pipeline stopped at the **${stage}** stage. See the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full logs."
              echo ""
              log=$(git log "origin/${branch}" --oneline -5 2>/dev/null || true)
              if [[ -n "$log" ]]; then
                echo "**Recent commits on \`${branch}\`:**"
                echo '```'
                echo "$log"
                echo '```'
              fi
            fi
            echo ""
            echo "**To continue manually:** check out \`${branch}\`, finish the work, push, and open a PR. Remove the \`agent-failed\` label when resolved."
            echo ""
            echo "---"
            echo "*:robot: Posted automatically after the agent pipeline stopped.*"
          } > /tmp/failure.md

          gh issue comment "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/failure.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove in-progress label
        run: |
          gh issue edit "${{ inputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent-in-progress" || true

          # Tag the outcome so the orchestrator and humans can see at a glance.
          if [[ "${{ needs.integration.result }}" == "success" ]]; then
            gh issue edit "${{ inputs.issue_number }}" \
              --repo "${{ github.repository }}" \
              --add-label "agent-pr-ready" || true
          else
            gh issue edit "${{ inputs.issue_number }}" \
              --repo "${{ github.repository }}" \
              --add-label "agent-failed" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
