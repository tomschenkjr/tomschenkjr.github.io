name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly baseline refresh for visual regression (Sundays 2am UTC)
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update visual regression baselines"
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # grunt-contrib-imagemin@0.2 has a broken postinstall on Node ≥ 18.
      # --ignore-scripts skips it; we don't need imagemin for tests.
      - run: npm install --ignore-scripts

      - name: JS lint (JSHint)
        run: npm run lint:js

      - name: SCSS lint (Stylelint)
        run: npm run lint:scss

  build:
    name: Jekyll build + HTML-Proofer
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Verify required output files
        run: |
          for f in _site/index.html _site/sitemap.xml _site/feed.xml; do
            [ -f "$f" ] || (echo "Missing: $f" && exit 1)
          done

      - name: HTML-Proofer (internal links + assets)
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --ignore-urls "/fonts.googleapis.com/"

  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm install --ignore-scripts

      - name: Run Jest unit tests
        run: npm run test:unit

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.js starts Jekyll automatically via webServer config
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch, not on every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npm run test:visual -- --update-snapshots
          else
            npm run test:visual
          fi
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diff
          path: playwright-report/
          retention-days: 30
